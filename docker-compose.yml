services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app/backend
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://nextcloud:123456@postgres:5432/nextcloud
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/backend
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        echo "Running Alembic migrations against: $$DATABASE_URL"

        mkdir -p alembic/versions

        if ! find alembic/versions -maxdepth 1 -type f -name "*.py" | grep -q .; then
          echo "No Alembic revision files found. Generating initial migration..."
          alembic -c alembic.ini revision --autogenerate -m "generate tables"
        else
          echo "Alembic revision files found. Skipping autogenerate."
        fi

        GENERATED_REVISION="$$(ls -t alembic/versions/*.py | head -n 1)"

        if grep -q "pgvector.sqlalchemy" "$$GENERATED_REVISION" && ! grep -q "import pgvector" "$$GENERATED_REVISION"; then
          echo "Patching generated migration with pgvector import..."
          sed -i '/import sqlalchemy as sa/a import pgvector' "$$GENERATED_REVISION"
        fi

        if grep -q "VECTOR" "$$GENERATED_REVISION" && ! grep -q "CREATE EXTENSION IF NOT EXISTS vector" "$$GENERATED_REVISION"; then
          echo "Patching generated migration with pgvector extension creation..."
          sed -i '/def upgrade()/a\    op.execute("CREATE EXTENSION IF NOT EXISTS vector")' "$$GENERATED_REVISION"
        fi

        echo "Applying migrations..."
        alembic -c alembic.ini upgrade head
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app/backend
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://nextcloud:123456@postgres:5432/nextcloud
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_BOOTSTRAP_MODE: check
      FRONTEND_URL: http://localhost:5173
      AUTH_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    working_dir: /app/backend
    ports:
      - "8000:8000"
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        python -m scripts.seed_admin
        uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app/backend
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://nextcloud:123456@postgres:5432/nextcloud
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_BOOTSTRAP_MODE: check
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    working_dir: /app/backend
    command:
      - /bin/sh
      - -c
      - |
        celery -A workers.celery_app:celery_app worker --loglevel=INFO

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app/backend
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://nextcloud:123456@postgres:5432/nextcloud
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_BOOTSTRAP_MODE: check
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    working_dir: /app/backend
    command:
      - /bin/sh
      - -c
      - |
        celery -A workers.celery_app:celery_app beat --loglevel=INFO

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    command: npm run dev -- --host 0.0.0.0

  nextcloud-db:
    image: mariadb:11
    command:
      - --transaction-isolation=READ-COMMITTED
      - --log-bin=binlog
      - --binlog-format=ROW
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: nextcloud_root
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud
    volumes:
      - nextcloud_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  nextcloud:
    image: nextcloud:31-apache
    depends_on:
      nextcloud-db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud"
      OVERWRITEHOST: "localhost:8081"
      OVERWRITEPROTOCOL: http
      OVERWRITECLIURL: "http://localhost:8081"
      NC_AI_BRIDGE_FASTAPI_BASE_URL: "http://localhost:8000"
    env_file:
      - ./backend/.env
    volumes:
      - nextcloud_data:/var/www/html
      - ./nc_ai_bridge:/nc_ai_bridge_seed:ro
      - ./deployment/scripts/nextcloud-configure-bridge.sh:/docker-entrypoint-hooks.d/before-starting/10-configure-bridge.sh:ro

volumes:
  pgdata:
  ollama:
  nextcloud_db:
  nextcloud_data:
