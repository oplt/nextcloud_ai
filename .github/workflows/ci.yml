name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync dependencies
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv sync --extra dev
      - name: Ruff (selected correctness rules)
        run: |
          uv run ruff check . --select F401,F811,F821,F841
      - name: Unit tests
        env:
          PYTHONPATH: ..
        run: |
          uv run pytest tests/test_offline_scorer.py tests/test_offline_eval_harness.py tests/test_chat_direct_answer.py tests/test_phase1a_deployment.py tests/test_phase1b_auth_webhooks.py tests/test_phase1c_imap_citations.py tests/test_phase2_indexing_jobs.py tests/test_phase3_parse_chunk_embed.py tests/test_phase3_embeddings.py tests/test_phase4_lexical.py tests/test_phase4_score_contract.py tests/test_phase4_context_pack.py tests/test_phase5_resources.py tests/test_phase5_database_async.py tests/test_phase6_simplify.py -q
      - name: Offline eval fixture baseline
        env:
          PYTHONPATH: ..
        run: |
          uv run python -m backend.evals.run_offline_eval --mode fixture --summary-only

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        run: npm run build
